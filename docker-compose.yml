services:
  db:
    image: bitnami/postgresql:latest
    container_name: financy-db
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRESQL_USERNAME: ${DB_USER:-financy}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:-financy}
      POSTGRESQL_DATABASE: ${DB_NAME:-financy}
    volumes:
      - financy_pg_data:/bitnami/postgresql

  # Banco dos testes de integração; sem volume, os dados somem quando o container cai.
  db-test:
    image: bitnami/postgresql:latest
    container_name: financy-db-test
    ports:
      - "5435:5432"
    environment:
      POSTGRESQL_USERNAME: financy
      POSTGRESQL_PASSWORD: financy
      POSTGRESQL_DATABASE: financy_test

volumes:
  financy_pg_data:
