services:
  db:
    image: bitnami/postgresql:latest
    container_name: financy-db
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRESQL_USERNAME: ${DB_USER:-financy}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:-financy}
      POSTGRESQL_DATABASE: ${DB_NAME:-financy}
    volumes:
      - financy_pg_data:/bitnami/postgresql

volumes:
  financy_pg_data:
